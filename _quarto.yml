project:
  type: website
  output-dir: _site
  resources:
    - "assets/**"
  render:
    - index.qmd
    - research.qmd
    - setup.qmd
    - publications.qmd
    - namecard.qmd
    - game.qmd
    - projects.qmd

website:
  title: "Gi Rim Han"
  favicon: assets/favicon.svg
  search: false
  navbar:
    pinned: true
    left:
      - href: research.qmd
        text: Research
      - href: setup.qmd
        text: Setup
      - href: publications.qmd
        text: Publications
      - href: namecard.qmd
        text: Namecard
      - href: game.qmd
        text: Game
  page-footer:
    left: "© 2026 Gi Rim Han"

format:
  html:
    theme:
      - lumen
      - styles.scss
    toc: false
    smooth-scroll: true
    anchor-sections: false
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="theme-color" content="#158cba">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@400;700&amp;family=Neucha&amp;display=swap">
        <meta name="description" content="Gi Rim Han — experimental physical chemist working in ultrafast spectroscopy and photophysical dynamics.">
        <script>
          try {
            document.documentElement.dataset.siteLanguage =
              localStorage.getItem("grh-site-language") === "ko" ? "ko" : "en";
          } catch {
            document.documentElement.dataset.siteLanguage = "en";
          }
        </script>
        <script src="assets/site-v3.js?v=20261023-pages-assets" defer></script>

execute:
  freeze: auto
